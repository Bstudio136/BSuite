        const previewPlaceholder = document.getElementById('preview-placeholder');
        const statusBadge = document.getElementById('status-badge');
        const actionBtn = document.getElementById('action-btn');
        const actionBtnText = document.getElementById('action-btn-text');
        const downloadBtn = document.getElementById('download-btn');
        const downloadBtnText = document.getElementById('download-btn-text');
        const copyBtn = document.getElementById('copy-btn');
        const capacityIndicator = document.getElementById('capacity-indicator');

        function generatePassword() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=[]{}|;:,.<>?";
            const array = new Uint8Array(20);
            window.crypto.getRandomValues(array);
            cryptoKeyEl.value = Array.from(array, x => chars[x % chars.length]).join('');
            cryptoKeyEl.type = 'text';
            updateStatus("MOT DE PASSE GÉNÉRÉ !", "info");
        }
        function togglePasswordVisibility() {
            cryptoKeyEl.type = (cryptoKeyEl.type === 'password') ? 'text' : 'password';
        }
        function copyPassword() {
            if (!cryptoKeyEl.value) return;
            navigator.clipboard.writeText(cryptoKeyEl.value).then(() => updateStatus("MOT DE PASSE COPIÉ !", "success"));
        }

        async function deriveKey(password, salt) {
            const enc = new TextEncoder();
            const keyMaterial = await window.crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
            return await window.crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" }, keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
        }

        async function encryptAESGCM(plainText, password) {
            const enc = new TextEncoder();
            const salt = window.crypto.getRandomValues(new Uint8Array(16));
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const key = await deriveKey(password, salt);
            const encryptedBuffer = await window.crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, enc.encode(plainText));
            const combined = new Uint8Array(salt.length + iv.length + encryptedBuffer.byteLength);
            combined.set(salt, 0); combined.set(iv, salt.length); combined.set(new Uint8Array(encryptedBuffer), salt.length + iv.length);
            return "ENC_AES:" + btoa(String.fromCharCode(...combined));
        }

        async function decryptAESGCM(cipherText, password) {
            if (!cipherText.startsWith("ENC_AES:")) throw new Error("Format invalide");
            const rawBase64 = cipherText.replace("ENC_AES:", "");
            const binaryStr = atob(rawBase64);
            const combined = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) combined[i] = binaryStr.charCodeAt(i);
            const salt = combined.slice(0, 16);
            const iv = combined.slice(16, 28);
            const data = combined.slice(28);
            const key = await deriveKey(password, salt);
            const decryptedBuffer = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, data);
            return new TextDecoder().decode(decryptedBuffer);
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('tab-encode').classList.toggle('active', mode === 'encode');
            document.getElementById('tab-decode').classList.toggle('active', mode === 'decode');
            document.getElementById('tab-clean').classList.toggle('active', mode === 'clean');

            decodedOutput.style.display = 'none';
            exifOutput.style.display = 'none';
            copyBtn.classList.remove('show');
            downloadBtn.classList.remove('show');

            if (mode === 'encode') {
                encodeMsgBox.style.display = 'block';
                cryptoBox.style.display = 'block';
                actionBtnText.textContent = "LANCER L'ENCODAGE LSB";
                downloadBtnText.textContent = "TÉLÉCHARGER L'IMAGE PNG";
            } else if (mode === 'decode') {
                encodeMsgBox.style.display = 'none';
                cryptoBox.style.display = 'block';
                actionBtnText.textContent = "EXTRAIRE LE MESSAGE SECRET";
            } else if (mode === 'clean') {
                encodeMsgBox.style.display = 'none';
                cryptoBox.style.display = 'none';
                actionBtnText.textContent = "SUPPRIMER LES MÉTADONNÉES";
                downloadBtnText.textContent = "TÉLÉCHARGER L'IMAGE NETTOYÉE";
                if (loadedFile) analyzeExif(loadedFile);
            }

            if (loadedImage) {
                imagePreview.style.display = 'block';
                previewPlaceholder.style.display = 'none';
            }
        }

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) { updateStatus("ERREUR: IMAGE REQUISE", "error"); return; }
            loadedFile = file;
            fileNameEl.textContent = file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    loadedImage = img;
                    imagePreview.src = img.src;
                    imagePreview.style.display = 'block';
                    previewPlaceholder.style.display = 'none';
                    capacityIndicator.textContent = 'Capacité: ~' + (Math.floor((img.width * img.height * 3) / 8) / 1024).toFixed(1) + ' KB';
                    updateStatus("IMAGE CHARGÉE", "success");
                    if (currentMode === 'clean') analyzeExif(file);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function executeProcess() {
            if (!loadedImage) { updateStatus("VEUILLEZ CHARGER UNE IMAGE", "error"); return; }
            if (currentMode === 'encode') await encodeLSB();
            else if (currentMode === 'decode') await decodeLSB();
            else if (currentMode === 'clean') await cleanMetadata();
        }

        async function encodeLSB() {
            let msg = secretMsgEl.value;
            const password = cryptoKeyEl.value;
            if (!msg.trim()) { updateStatus("SAISISSEZ UN MESSAGE", "error"); return; }
            try {
                if (password) msg = await encryptAESGCM(msg, password);
                const payload = msg + DELIMITER;
                const binaryArr = [];
                for (let i = 0; i < payload.length; i++) {
                    const c = payload.charCodeAt(i);
                    for (let b = 7; b >= 0; b--) binaryArr.push((c >> b) & 1);
                }
                const canvas = document.getElementById('steg-canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = loadedImage.width;
                canvas.height = loadedImage.height;
                ctx.drawImage(loadedImage, 0, 0);
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;
                let bitIdx = 0;
                for (let i = 0; i < data.length && bitIdx < binaryArr.length; i++) {
                    if ((i + 1) % 4 === 0) continue;
                    data[i] = (data[i] & ~1) | binaryArr[bitIdx++];
                }
                ctx.putImageData(imgData, 0, 0);
                const url = canvas.toDataURL('image/png');
                imagePreview.src = url;
                downloadBtn.href = url;
                downloadBtn.download = 'bstegano_' + Date.now() + '.png';
                downloadBtn.classList.add('show');
                updateStatus("ENCODAGE RÉUSSI !", "success");
            } catch (err) { updateStatus("ERREUR LORS DU CHIFFREMENT", "error"); }
        }

        async function decodeLSB() {
            const password = cryptoKeyEl.value;
            const canvas = document.getElementById('steg-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = loadedImage.width;
            canvas.height = loadedImage.height;
            ctx.drawImage(loadedImage, 0, 0);
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            let extracted = "", byteVal = 0, bitCount = 0;

            for (let i = 0; i < data.length; i++) {
                if ((i + 1) % 4 === 0) continue;
                byteVal = (byteVal << 1) | (data[i] & 1);
                bitCount++;
                if (bitCount === 8) {
                    extracted += String.fromCharCode(byteVal);
                    if (extracted.endsWith(DELIMITER)) {
                        let finalMsg = extracted.slice(0, -DELIMITER.length);
                        try {
                            if (finalMsg.startsWith("ENC_AES:")) {
                                if (!password) {
                                    updateStatus("MOT DE PASSE REQUIS", "error");
                                    decodedOutput.value = "🔒 Message chiffré. Mot de passe requis.";
                                    decodedOutput.style.display = 'block';
                                    imagePreview.style.display = 'none';
                                    return;
                                }
                                finalMsg = await decryptAESGCM(finalMsg, password);
                            }
                            decodedOutput.value = finalMsg;
                            decodedOutput.style.display = 'block';
                            imagePreview.style.display = 'none';
                            copyBtn.classList.add('show');
                            updateStatus("DÉCODAGE RÉUSSI !", "success");
                            return;
                        } catch (e) {
                            updateStatus("MOT DE PASSE INCORRECT", "error");
                            decodedOutput.value = "❌ Échec du déchiffrement.";
                            decodedOutput.style.display = 'block';
                            imagePreview.style.display = 'none';
                            return;
                        }
                    }
                    byteVal = 0;
                    bitCount = 0;
                }
            }
            updateStatus("AUCUN MESSAGE TROUVÉ", "error");
        }

        function analyzeExif(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const view = new DataView(e.target.result);
                let html = '<div class="exif-title">RAPPORT EXIF & GOLOCALISATION :</div>';

                if (view.getUint16(0, false) !== 0xFFD8) {
                    exifOutput.innerHTML = html + '<p style="color: #9ca3af;">Pas un JPEG standard avec EXIF.</p>';
                    exifOutput.style.display = 'block';
                    imagePreview.style.display = 'none';
                    return;
                }

                let offset = 2, exifFound = false;
                while (offset < view.byteLength) {
                    const marker = view.getUint16(offset, false);
                    offset += 2;
                    if (marker === 0xFFE1) {
                        exifFound = true;
                        if (view.getUint32(offset + 2, false) !== 0x45786966) break;
                        const tiffOffset = offset + 8;
                        const littleEndian = view.getUint16(tiffOffset, false) === 0x4949;
                        const ifdOffset = view.getUint32(tiffOffset + 4, littleEndian);
                        const allTags = parseIFDComprehensive(view, tiffOffset, tiffOffset + ifdOffset, littleEndian);

                        if (Object.keys(allTags).length > 0) {
                            html += '<ul>';
                            for (const [k, v] of Object.entries(allTags)) {
                                const isGps = k.includes('GPS') || k.includes('Lat') || k.includes('Lon');
                                html += '<li><span class="exif-key">' + k + ' :</span> <span class="' + (isGps ? 'exif-gps' : '') + '">' + v + '</span></li>';
                            }
                            html += '</ul>';
                        } else {
                            html += '<p style="color: #ff0055;">⚠️ EXIF détecté mais balises vides.</p>';
                        }
                        break;
                    } else if ((marker & 0xFF00) !== 0xFF00) break;
                    else offset += view.getUint16(offset, false);
                }

                if (!exifFound) html += '<p style="color: #00ff66;">✅ Aucune métadonnée EXIF / GPS (Image propre).</p>';
                exifOutput.innerHTML = html;
                exifOutput.style.display = 'block';
                imagePreview.style.display = 'none';
            };
            reader.readAsArrayBuffer(file);
        }

        function parseIFDComprehensive(view, tiffOffset, dirOffset, littleEndian) {
            const mapTags = {
                0x010E: "Description de l'image", 0x010F: "Fabricant (Marque)",
                0x0110: "Modèle d'appareil", 0x0112: "Orientation",
                0x0131: "Logiciel / Firmware", 0x0132: "Date et heure de modification",
                0x8825: "Pointeur GPS IFD"
            };
            if (dirOffset >= view.byteLength) return {};
            const entries = view.getUint16(dirOffset, littleEndian);
            let result = {};

            for (let i = 0; i < entries; i++) {
                const entryOffset = dirOffset + 2 + (i * 12);
                if (entryOffset + 12 > view.byteLength) break;
                const tag = view.getUint16(entryOffset, littleEndian);
                const type = view.getUint16(entryOffset + 2, littleEndian);
                const count = view.getUint32(entryOffset + 4, littleEndian);
                const valueOffset = entryOffset + 8;

                if (tag === 0x8825) {
                    const relGpsOffset = view.getUint32(valueOffset, littleEndian);
                    const gpsOffset = tiffOffset + relGpsOffset;
                    const gpsData = parseGPSIFD(view, tiffOffset, gpsOffset, littleEndian);
                    result = { ...result, ...gpsData };
                } else if (mapTags[tag]) {
                    const val = extractValue(view, tiffOffset, type, count, valueOffset, littleEndian);
                    result[mapTags[tag]] = Array.isArray(val) ? val.join(', ') : val;
                }
            }
            return result;
        }

        function parseGPSIFD(view, tiffOffset, dirOffset, littleEndian) {
            const gpsTags = { 0x0001: "Latitude Ref", 0x0002: "Latitude", 0x0003: "Longitude Ref", 0x0004: "Longitude", 0x0005: "Altitude Ref", 0x0006: "Altitude" };
            if (dirOffset >= view.byteLength) return {};
            const entries = view.getUint16(dirOffset, littleEndian);
            let gpsRes = {};
            let lat = null, latRef = "N", lon = null, lonRef = "E";

            for (let i = 0; i < entries; i++) {
                const entryOffset = dirOffset + 2 + (i * 12);
                if (entryOffset + 12 > view.byteLength) break;
                const tag = view.getUint16(entryOffset, littleEndian);
                const type = view.getUint16(entryOffset + 2, littleEndian);
                const count = view.getUint32(entryOffset + 4, littleEndian);
                const valueOffset = entryOffset + 8;
                const val = extractValue(view, tiffOffset, type, count, valueOffset, littleEndian);

                if (tag === 0x0001) latRef = cleanRef(val);
                if (tag === 0x0002) lat = val;
                if (tag === 0x0003) lonRef = cleanRef(val);
                if (tag === 0x0004) lon = val;
                if (gpsTags[tag]) gpsRes[gpsTags[tag]] = Array.isArray(val) ? val.join(', ') : val;
            }

            if (Array.isArray(lat) && lat.length >= 3 && Array.isArray(lon) && lon.length >= 3) {
                const decLat = convertDMSToDecimal(lat[0], lat[1], lat[2], latRef);
                const decLon = convertDMSToDecimal(lon[0], lon[1], lon[2], lonRef);
                if (parseFloat(decLat) !== 0 || parseFloat(decLon) !== 0) {
                    gpsRes["📍 POSITION GPS EXACTE"] = decLat + ', ' + decLon + ' (<a href="https://maps.google.com/?q=' + decLat + ',' + decLon + '" target="_blank" style="color: var(--cyan); text-decoration: underline; font-weight: 700;">Ouvrir Maps</a>)';
                }
            }
            return gpsRes;
        }

        function cleanRef(val) {
            if (typeof val === 'string' && val.trim() !== '') return val.trim().toUpperCase();
            if (typeof val === 'number') return String.fromCharCode(val).toUpperCase();
            if (Array.isArray(val) && val.length > 0) return String.fromCharCode(val[0]).toUpperCase();
            return 'N';
        }

        function extractValue(view, tiffOffset, type, count, valueOffset, littleEndian) {
            let dataOffset = valueOffset;
            const typeSize = getTypeSize(type);
            if (count * typeSize > 4) {
                const relOffset = view.getUint32(valueOffset, littleEndian);
                dataOffset = tiffOffset + relOffset;
                if (dataOffset >= view.byteLength) dataOffset = relOffset;
            }

            if (type === 1 || type === 7) {
                if (count === 1) return view.getUint8(dataOffset);
                let str = "";
                for (let c = 0; c < count; c++) {
                    if (dataOffset + c >= view.byteLength) break;
                    const charCode = view.getUint8(dataOffset + c);
                    if (charCode === 0) break;
                    str += String.fromCharCode(charCode);
                }
                return str.trim() !== "" ? str.trim() : Array.from({length: count}, (_, c) => view.getUint8(dataOffset + c));
            } else if (type === 2) {
                let str = "";
                for (let c = 0; c < count; c++) {
                    if (dataOffset + c >= view.byteLength) break;
                    const charCode = view.getUint8(dataOffset + c);
                    if (charCode === 0) break;
                    str += String.fromCharCode(charCode);
                }
                return str.trim();
            } else if (type === 3) {
                if (count === 1) return view.getUint16(dataOffset, littleEndian);
                let arr = [];
                for (let i = 0; i < count; i++) {
                    if (dataOffset + i * 2 + 2 > view.byteLength) break;
                    arr.push(view.getUint16(dataOffset + (i * 2), littleEndian));
                }
                return arr;
            } else if (type === 4) {
                if (count === 1) return view.getUint32(dataOffset, littleEndian);
                let arr = [];
                for (let i = 0; i < count; i++) {
                    if (dataOffset + i * 4 + 4 > view.byteLength) break;
                    arr.push(view.getUint32(dataOffset + (i * 4), littleEndian));
                }
                return arr;
            } else if (type === 5 || type === 10) {
                if (count === 1) {
                    if (dataOffset + 8 > view.byteLength) return 0;
                    const num = view.getUint32(dataOffset, littleEndian);
                    const den = view.getUint32(dataOffset + 4, littleEndian);
                    return den !== 0 ? +(num / den).toFixed(6) : num;
                } else {
                    let arr = [];
                    for (let i = 0; i < count; i++) {
                        const currentOffset = dataOffset + (i * 8);
                        if (currentOffset + 8 > view.byteLength) break;
                        const num = view.getUint32(currentOffset, littleEndian);
                        const den = view.getUint32(currentOffset + 4, littleEndian);
                        arr.push(den !== 0 ? +(num / den).toFixed(6) : num);
                    }
                    return arr;
                }
            }
            return "Inconnu";
        }

        function getTypeSize(type) {
            switch(type) {
                case 1: case 2: case 7: return 1;
                case 3: return 2;
                case 4: case 9: case 11: return 4;
                case 5: case 10: case 12: return 8;
                default: return 1;
            }
        }

        function convertDMSToDecimal(degrees, minutes, seconds, direction) {
            let decimal = degrees + (minutes / 60) + (seconds / 3600);
            if (direction === "S" || direction === "W") decimal *= -1;
            return decimal.toFixed(6);
        }

        async function cleanMetadata() {
            const canvas = document.getElementById('steg-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = loadedImage.width;
            canvas.height = loadedImage.height;
            ctx.drawImage(loadedImage, 0, 0);
            const cleanedUrl = canvas.toDataURL('image/jpeg', 0.95);
            imagePreview.src = cleanedUrl;
            imagePreview.style.display = 'block';
            exifOutput.style.display = 'none';
            downloadBtn.href = cleanedUrl;
            downloadBtn.download = 'clean_' + Date.now() + '.jpg';
            downloadBtn.classList.add('show');
            updateStatus("MÉTADONNÉES & GPS EFFACÉS !", "success");
        }

        function purgeAllData() {
            loadedImage = null;
            loadedFile = null;
            fileInput.value = '';
            fileNameEl.textContent = 'Aucune image sélectionnée';
            secretMsgEl.value = '';
            cryptoKeyEl.value = '';
            decodedOutput.value = '';
            exifOutput.innerHTML = '';
            imagePreview.src = '';
            imagePreview.style.display = 'none';
            decodedOutput.style.display = 'none';
            exifOutput.style.display = 'none';
            previewPlaceholder.style.display = 'block';
            downloadBtn.classList.remove('show');
            copyBtn.classList.remove('show');
            capacityIndicator.textContent = 'Capacité: --';
            updateStatus("PURGE EFFECTUÉE", "info");
        }

        function updateStatus(msg, type) {
            statusBadge.textContent = msg;
            let color = '#a855f7';
            if (type === 'success') color = '#00ff66';
            else if (type === 'error') color = '#ff0055';
            else if (type === 'info') color = '#00f0ff';
            statusBadge.style.color = color;
        }

        function copyDecodedText() {
            navigator.clipboard.writeText(decodedOutput.value).then(() => {
                const orig = copyBtn.innerHTML;
                copyBtn.innerHTML = '<span>✅ COPIÉ !</span>';
                setTimeout(() => copyBtn.innerHTML = orig, 1800);
            });
        }
    </script>
</body>
</html>

<script>
    /* ==========================================
       LOGIQUE DE LA CALCULATRICE LEURRE
       ========================================== */
    let calcCurrent = '0';
    let calcPrev = null;
    let currentOperation = null;
    let calcWait = false;
    let justEvaluated = false;
    let lastExpressionText = '';
    let secretBuffer = '';
    let equalsCount = 0;

    /* Historique factice de la calculatrice */
    let calcHistory = [
        { expr: '12+35', result: '47' },
        { expr: '8×9', result: '72' },
        { expr: '100÷4', result: '25' },
        { expr: '56-19', result: '37' },
        { expr: '7×8', result: '56' },
        { expr: '144÷12', result: '12' },
        { expr: '230+470', result: '700' }
    ];

    function getOpSymbol(op) {
        return { '+': '+', '-': '-', '*': '×', '/': '÷' }[op] || '';
    }

    function formatCalcNumber(n) {
        if (n === null || n === undefined) return '';
        return String(n);
    }

    function buildExpressionText() {
        if (justEvaluated) return lastExpressionText;
        let parts = [];
        if (calcPrev !== null) {
            parts.push(formatCalcNumber(calcPrev));
            if (currentOperation) parts.push(getOpSymbol(currentOperation));
            if (!calcWait) parts.push(calcCurrent);
        }
        return parts.join('');
    }

    function updateCalcDisplay() {
        const display = document.getElementById('calc-display');
        const exprEl = document.getElementById('calc-expression');
        if (display) display.textContent = String(calcCurrent).replace('.', ',');
        if (exprEl) exprEl.textContent = buildExpressionText().replace(/\./g, ',');
    }

    function calcNum(num) {
        if (num === ',') num = '.'; // Normalize comma to dot for calculation

        if (justEvaluated) {
            calcPrev = null;
            currentOperation = null;
            justEvaluated = false;
            lastExpressionText = '';
            calcCurrent = '0';
            calcWait = false;
        }

        if (calcWait) {
            calcCurrent = (num === '.') ? '0.' : num;
            calcWait = false;
        } else {
            if (num === '.' && calcCurrent.includes('.')) return;
            calcCurrent = (calcCurrent === '0' && num !== '.') ? num : calcCurrent + num;
        }

        if (calcCurrent.length > 12) {
            calcCurrent = calcCurrent.slice(0, 12);
        }

        secretBuffer += num;
        if (secretBuffer.length > 15) secretBuffer = secretBuffer.slice(-15);

        updateCalcDisplay();
    }

    function calcOp(op) {
        if (justEvaluated) {
            justEvaluated = false;
            lastExpressionText = '';
        } else if (currentOperation !== null && !calcWait) {
            const current = parseFloat(calcCurrent);
            let result = 0;
            switch (currentOperation) {
                case '+': result = calcPrev + current; break;
                case '-': result = calcPrev - current; break;
                case '*': result = calcPrev * current; break;
                case '/': result = current === 0 ? 0 : calcPrev / current; break;
            }
            calcCurrent = String(Math.round(result * 100000000) / 100000000);
        }

        calcPrev = parseFloat(calcCurrent);
        currentOperation = op;
        calcWait = true;
        secretBuffer = '';
        equalsCount = 0;
        updateCalcDisplay();
    }

    function calcEquals() {
        /* Code secret : 01360 puis 3 appuis sur '=' */
        if (secretBuffer.endsWith('01360')) {
            equalsCount++;
            if (equalsCount >= 3) {
                unlockBSuite();
                return;
            }
        } else {
            equalsCount = 0;
        }

        if (currentOperation === null || calcWait) return;

        const current = parseFloat(calcCurrent);
        let result = 0;
        switch (currentOperation) {
            case '+': result = calcPrev + current; break;
            case '-': result = calcPrev - current; break;
            case '*': result = calcPrev * current; break;
            case '/': result = current === 0 ? 0 : calcPrev / current; break;
        }

        const resultStr = String(Math.round(result * 100000000) / 100000000);
        const exprStr = formatCalcNumber(calcPrev) + getOpSymbol(currentOperation) + calcCurrent;

        lastExpressionText = exprStr;
        addToCalcHistory(exprStr, resultStr);

        calcCurrent = resultStr;
        currentOperation = null;
        calcPrev = null;
        calcWait = true;
        justEvaluated = true;
        updateCalcDisplay();

        secretBuffer = '';
        equalsCount = 0;
    }

    function calcClear() {
        calcCurrent = '0';
        calcPrev = null;
        currentOperation = null;
        calcWait = false;
        justEvaluated = false;
        lastExpressionText = '';
        secretBuffer = '';
        equalsCount = 0;
        updateCalcDisplay();
    }

    function calcBackspace() {
        if (justEvaluated) {
            /* Après '=', effacer efface tout */
            calcClear();
            return;
        }

        if (calcWait) {
            /* On annule l'opérateur en cours */
            currentOperation = null;
            calcPrev = null;
            calcWait = false;
            updateCalcDisplay();
            return;
        }

        if (calcCurrent.length > 1) {
            calcCurrent = calcCurrent.slice(0, -1);
        } else {
            calcCurrent = '0';
        }
        updateCalcDisplay();
    }

    function calcToggleSign() {
        if (calcCurrent === '0') return;
        calcCurrent = String(parseFloat(calcCurrent) * -1);
        updateCalcDisplay();
    }

    function calcPercent() {
        if (calcWait) return; // Rien à faire si on attend un nombre

        let current = parseFloat(calcCurrent);
        
        // Si une opération est en cours (ex: 200 - 30%)
        if (calcPrev !== null && currentOperation !== null) {
            if (currentOperation === '+' || currentOperation === '-') {
                // Pour l'addition et la soustraction, on calcule le pourcentage de la valeur précédente
                // Ex: 200 - 30% => 200 - (200 * 30 / 100) = 200 - 60 = 140
                current = (calcPrev * current) / 100;
            } else if (currentOperation === '*' || currentOperation === '/') {
                // Pour la multiplication et la division, on divise simplement par 100
                // Ex: 200 * 10% => 200 * 0.1 = 20
                current = current / 100;
            }
        } else {
            // Pas d'opération en cours, on divise simplement par 100
            current = current / 100;
        }
        
        // Formater le résultat pour éviter les problèmes de précision flottante
        calcCurrent = String(Math.round(current * 100000000) / 100000000);
        updateCalcDisplay();
    }

    /* ===== HISTORIQUE CALCULATRICE ===== */
    function toggleCalcHistory() {
        const panel = document.getElementById('calc-history-panel');
        if (!panel) return;
        panel.classList.toggle('open');
        if (panel.classList.contains('open')) renderCalcHistory();
    }

    function renderCalcHistory() {
        const list = document.getElementById('calc-history-list');
        if (!list) return;
        if (calcHistory.length === 0) {
            list.innerHTML = '<div class="calc-history-empty">Aucun historique</div>';
            return;
        }
        list.innerHTML = calcHistory.map((item, i) =>
            '<div class="calc-history-item" data-idx="' + i + '">' +
                '<div class="hist-expr">' + item.expr + '</div>' +
                '<div class="hist-result">' + item.result + '</div>' +
            '</div>'
        ).join('');
        list.querySelectorAll('.calc-history-item').forEach(el => {
            el.addEventListener('click', () => {
                const idx = parseInt(el.dataset.idx, 10);
                useCalcHistoryItem(idx);
            });
        });
    }

    function useCalcHistoryItem(i) {
        const item = calcHistory[i];
        if (!item) return;
        calcCurrent = item.result;
        justEvaluated = true;
        lastExpressionText = item.expr;
        calcPrev = null;
        currentOperation = null;
        calcWait = true;
        const panel = document.getElementById('calc-history-panel');
        if (panel) panel.classList.remove('open');
        updateCalcDisplay();
    }

    function clearCalcHistory() {
        calcHistory = [];
        renderCalcHistory();
    }

    function addToCalcHistory(expr, result) {
        if (!expr) return;
        calcHistory.unshift({ expr: expr, result: result });
        if (calcHistory.length > 30) calcHistory.pop();
    }

    /* Fermer le panneau historique en cliquant à l'extérieur */
    document.addEventListener('click', (e) => {
        const panel = document.getElementById('calc-history-panel');
        const actionBar = document.querySelector('.calc-action-bar');
        if (!panel || !panel.classList.contains('open')) return;
        if (panel.contains(e.target)) return;
        if (actionBar && actionBar.contains(e.target)) return;
        panel.classList.remove('open');
    });

    /* ==========================================
       DÉVERROUILLAGE DE B SUITE
       ========================================== */
    function unlockBSuite() {
        document.getElementById('calculator-disguise').style.display = 'none';

        const splash = document.getElementById('splash');
        splash.classList.remove('hidden');

        document.getElementById('hub').style.display = 'flex';

        setTimeout(() => {
            splash.classList.add('hidden');
        }, 1300);

        calcClear();
    }

    /* ==========================================
       LOGIQUE DE B SUITE
       ========================================== */
    let currentApp = null;

    function loadApp(appName) {
        const container = document.getElementById('app-container');
        const iframe = document.getElementById('app-iframe');
        const hub = document.getElementById('hub');
        const homeBtn = document.getElementById('home-btn');
        const loader = document.getElementById('app-loader');
        const loaderText = document.getElementById('app-loader-text');

        currentApp = appName;
        hub.style.display = 'none';
        container.classList.add('active');
        loader.classList.add('active');
        loaderText.textContent = 'CHARGEMENT...';

        const templateId = 'tpl-' + appName;
        const template = document.getElementById(templateId);

        if (!template) {
            console.error('Template introuvable:', templateId);
            loaderText.textContent = 'ERREUR: APP INTROUVABLE';
            return;
        }

        const htmlContent = template.innerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html' });
        const url = URL.createObjectURL(blob);

        homeBtn.classList.add('visible');

        iframe.onload = () => {
            URL.revokeObjectURL(url);
            iframe.onload = null;
            setTimeout(() => {
                loader.classList.remove('active');
            }, 200);
        };

        iframe.src = url;
    }

    function goBack() {
        const container = document.getElementById('app-container');
        const iframe = document.getElementById('app-iframe');
        const hub = document.getElementById('hub');
        const homeBtn = document.getElementById('home-btn');

        iframe.src = 'about:blank';
        homeBtn.classList.remove('visible');

        setTimeout(() => {
            container.classList.remove('active');
            hub.style.display = 'flex';
            currentApp = null;
        }, 100);
    }

    /* Initialisation de l'affichage au chargement */
    updateCalcDisplay();
</script>
</body>
