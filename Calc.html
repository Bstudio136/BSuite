<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Calculatrice</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=JetBrains+Mono:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #03050a;
            --card-bg: rgba(12, 16, 30, 0.9);
            --cyan: #00f0ff;
            --violet: #a855f7;
            --pink: #ff0055;
            --yellow: #ffb703;
            --green: #00ff88;
            --text: #f1f5f9;
            --text-dim: #64748b;
            --grad-primary: linear-gradient(135deg, #00f0ff 0%, #a855f7 100%);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%; height: 100dvh;
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(168, 85, 247, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(0, 240, 255, 0.1) 0%, transparent 50%),
                linear-gradient(rgba(100,100,100,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(100,100,100,0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 25px 25px, 25px 25px;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
        }

        /* ===== CALCULATRICE LEURRE ===== */
        #calculator-disguise {
            position: fixed; inset: 0; background: #000; z-index: 100000;
            display: flex; flex-direction: column; justify-content: flex-end;
            padding: 20px; padding-bottom: max(20px, env(safe-area-inset-bottom));
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            width: 100vw; height: 100dvh; overflow: hidden;
        }
        .calc-wrapper {
            width: 100%; max-width: 360px; margin: 0 auto;
            display: flex; flex-direction: column; gap: 8px;
        }

        /* Conteneur d'affichage à deux lignes */
        .calc-display-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            gap: 0px;
            padding: 4px 4px 0 0;
            min-height: 120px;
            overflow: hidden;
        }
        .calc-expression {
            color: #fff;
            font-size: clamp(1.8rem, 7vw, 2.6rem);
            font-weight: 300;
            letter-spacing: 1px;
            min-height: 2rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            text-align: right;
            width: 100%;
            line-height: 1.1;
            transition: color 0.2s;
            opacity: 0.9;
        }
        .calc-display {
            color: #fff;
            font-size: clamp(3rem, 14vw, 4.5rem);
            font-weight: 300;
            letter-spacing: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            text-align: right;
            width: 100%;
            line-height: 1.05;
        }

        /* Barre d'actions (Historique + Effacer) placée juste en dessous du résultat */
        .calc-action-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 4px;
            padding: 0 4px;
            margin-bottom: 6px;
        }
        .calc-icon-btn {
            background: transparent;
            border: none;
            color: #a5a5a5;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.15s, color 0.15s;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .calc-icon-btn:hover,
        .calc-icon-btn:active {
            background: #1c1c1e;
            color: #fff;
        }
        .calc-icon-btn svg {
            width: 22px;
            height: 22px;
            pointer-events: none;
        }

        .calc-keypad {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 10px; width: 100%;
        }
        .calc-btn {
            background: #333; color: #fff; border: none; border-radius: 50%;
            width: 100%; aspect-ratio: 1 / 1; 
            /* Taille de police augmentée */
            font-size: clamp(1.8rem, 8vw, 2.6rem);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: background 0.1s; user-select: none; -webkit-tap-highlight-color: transparent;
            padding: 0; margin: 0; box-sizing: border-box; min-width: 0; min-height: 0;
            font-family: inherit;
        }
        .calc-btn:active { background: #555; }
        .calc-btn.op { background: #ff9f0a; color: #fff; font-weight: 500; }
        .calc-btn.op:active { background: #ffb340; }
        .calc-btn.clear { background: #a5a5a5; color: #000; font-weight: 500; }
        .calc-btn.clear:active { background: #d4d4d4; }
        
        /* Bouton zéro modifié (style pilule, aligné à gauche) */
        .calc-btn.zero {
            grid-column: span 2;
            border-radius: 40px;
            justify-content: flex-start;
            padding-left: 25px;
            aspect-ratio: auto;
        }

        /* ===== PANNEAU HISTORIQUE ===== */
        .calc-history-panel {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            background: #1a1a1a;
            border-top-left-radius: 18px;
            border-top-right-radius: 18px;
            max-height: 65vh;
            display: flex;
            flex-direction: column;
            transform: translateY(110%);
            transition: transform 0.32s cubic-bezier(0.25, 0.8, 0.35, 1);
            z-index: 100001;
            box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.7);
            padding-bottom: env(safe-area-inset-bottom);
            will-change: transform;
        }
        .calc-history-panel.open { transform: translateY(0); }
        .calc-history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px 14px;
            border-bottom: 1px solid #2a2a2a;
            color: #fff;
            font-size: 1.05rem;
            font-weight: 600;
            flex-shrink: 0;
        }
        .calc-history-header button {
            background: transparent;
            border: none;
            color: #ff9f0a;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            transition: background 0.15s;
            font-family: inherit;
        }
        .calc-history-header button:active { background: #2a2a2a; }
        .calc-history-list {
            overflow-y: auto;
            flex: 1;
            padding: 4px 0;
            -webkit-overflow-scrolling: touch;
        }
        .calc-history-item {
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            cursor: pointer;
            transition: background 0.15s;
            border-bottom: 1px solid #1f1f1f;
            -webkit-tap-highlight-color: transparent;
        }
        .calc-history-item:active { background: #2a2a2a; }
        .calc-history-item .hist-expr {
            color: #8a8a8a;
            font-size: 0.9rem;
            letter-spacing: 1px;
            font-weight: 300;
        }
        .calc-history-item .hist-result {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 1px;
        }
        .calc-history-empty {
            padding: 40px 20px;
            text-align: center;
            color: #666;
            font-size: 0.9rem;
        }

        /* ===== CALCULATRICE SCIENTIFIQUE MODALE ===== */
        .sci-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100002;
            display: none; justify-content: center; align-items: center;
            padding: 20px;
        }
        .sci-modal.active { display: flex; }
        .sci-content {
            background: #1c1c1e; padding: 20px; border-radius: 15px; width: 100%; max-width: 400px;
            color: #fff; display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .sci-display {
            background: #000; padding: 15px; border-radius: 10px; text-align: right;
            font-size: 1.5rem; min-height: 60px; word-break: break-all;
            font-family: 'JetBrains Mono', monospace; color: #00f0ff;
            display: flex; align-items: flex-end; justify-content: flex-end;
        }
        .sci-keypad {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
        }
        .sci-keypad button {
            background: #333; color: #fff; border: none; padding: 12px; border-radius: 8px;
            font-size: 1rem; cursor: pointer; font-family: inherit;
            transition: background 0.1s;
        }
        .sci-keypad button:active { background: #555; }
        .sci-keypad button.op { background: #ff9f0a; }
        .sci-keypad button.op:active { background: #ffb340; }
        .sci-keypad button.clear { background: #a5a5a5; color: #000; }
        .sci-keypad button.clear:active { background: #d4d4d4; }
        .sci-close-btn {
            background: #ff9f0a; color: #fff; border: none; padding: 12px; border-radius: 8px;
            width: 100%; font-weight: bold; cursor: pointer; font-family: inherit;
            font-size: 0.9rem;
        }
        .sci-close-btn:active { background: #ffb340; }

        /* ===== HUB ===== */
        .hub-container {
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            height: 100%; padding: 20px; gap: 30px;
            position: relative; overflow: hidden;
        }
        .hub-container.active { display: flex; }

        .hub-container::before, .hub-container::after {
            content: ''; position: absolute; border-radius: 50%; pointer-events: none; z-index: 0;
        }
        .hub-container::before {
            width: 400px; height: 400px; top: -100px; left: -100px;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.3) 0%, transparent 70%);
            filter: blur(40px); animation: floatOrb1 12s ease-in-out infinite;
        }
        .hub-container::after {
            width: 500px; height: 500px; bottom: -150px; right: -150px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.35) 0%, transparent 70%);
            filter: blur(50px); animation: floatOrb2 15s ease-in-out infinite;
        }
        @keyframes floatOrb1 { 0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.7; } 50% { transform: translate(80px, 60px) scale(1.2); opacity: 1; } }
        @keyframes floatOrb2 { 0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.7; } 50% { transform: translate(-100px, -80px) scale(1.15); opacity: 1; } }

        .particles-bg { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .particle {
            position: absolute; width: 3px; height: 3px; border-radius: 50%;
            background: var(--cyan); box-shadow: 0 0 8px var(--cyan), 0 0 16px rgba(0, 240, 255, 0.6);
            animation: particleFloat linear infinite;
        }
        .particle:nth-child(1) { left: 8%; top: 100%; animation-duration: 15s; animation-delay: 0s; background: var(--cyan); }
        .particle:nth-child(2) { left: 22%; top: 100%; animation-duration: 18s; animation-delay: 2s; background: var(--violet); box-shadow: 0 0 8px var(--violet), 0 0 16px rgba(168, 85, 247, 0.6); }
        .particle:nth-child(3) { left: 40%; top: 100%; animation-duration: 20s; animation-delay: 4s; background: var(--cyan); }
        .particle:nth-child(4) { left: 58%; top: 100%; animation-duration: 16s; animation-delay: 1s; background: var(--pink); box-shadow: 0 0 8px var(--pink), 0 0 16px rgba(255, 0, 85, 0.6); }
        .particle:nth-child(5) { left: 74%; top: 100%; animation-duration: 22s; animation-delay: 3s; background: var(--violet); box-shadow: 0 0 8px var(--violet), 0 0 16px rgba(168, 85, 247, 0.6); }
        .particle:nth-child(6) { left: 90%; top: 100%; animation-duration: 19s; animation-delay: 5s; background: var(--cyan); }
        @keyframes particleFloat { 0% { transform: translateY(0) scale(1); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(-110vh) scale(0.5); opacity: 0; } }

        .hub-logo { text-align: center; margin-bottom: 10px; position: relative; z-index: 1; }
        .hub-logo h1 {
            font-family: 'Orbitron', sans-serif; font-size: clamp(2rem, 8vw, 3.5rem); font-weight: 900;
            background: linear-gradient(135deg, #00f0ff 0%, #a855f7 50%, #ff0055 100%);
            background-size: 200% 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 4px; filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.6));
            animation: titleShift 4s ease-in-out infinite, titleGlow 2s ease-in-out infinite alternate;
        }
        @keyframes titleShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        @keyframes titleGlow {
            from { filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.5)) drop-shadow(0 0 30px rgba(0, 240, 255, 0.3)); }
            to { filter: drop-shadow(0 0 25px rgba(168, 85, 247, 0.8)) drop-shadow(0 0 50px rgba(168, 85, 247, 0.5)) drop-shadow(0 0 70px rgba(255, 0, 85, 0.3)); }
        }
        .hub-subtitle { font-size: clamp(0.7rem, 2vw, 0.9rem); color: var(--cyan); letter-spacing: 3px; margin-top: 8px; text-shadow: 0 0 10px rgba(0, 240, 255, 0.8), 0 0 20px rgba(0, 240, 255, 0.4); animation: subtitlePulse 3s ease-in-out infinite; }
        @keyframes subtitlePulse { 0%, 100% { opacity: 0.7; letter-spacing: 3px; } 50% { opacity: 1; letter-spacing: 4px; } }

        .apps-grid { display: flex; flex-wrap: wrap; justify-content: center; align-items: stretch; gap: 16px; width: 100%; max-width: 720px; padding: 0 10px; position: relative; z-index: 1; }
        .app-card {
            background: linear-gradient(135deg, rgba(12, 16, 30, 0.95) 0%, rgba(20, 25, 45, 0.9) 100%);
            border: 1.5px solid rgba(0, 240, 255, 0.3); border-radius: 12px; padding: 18px 12px;
            display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden;
            flex: 0 0 calc(33.333% - 12px); max-width: 200px; min-width: 140px;
            clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15), inset 0 0 20px rgba(0, 240, 255, 0.05);
            animation: cardFloat 6s ease-in-out infinite;
        }
        .app-card:nth-child(1) { animation-delay: 0s; } .app-card:nth-child(2) { animation-delay: 0.5s; }
        .app-card:nth-child(3) { animation-delay: 1s; } .app-card:nth-child(4) { animation-delay: 1.5s; }
        .app-card:nth-child(5) { animation-delay: 2s; }
        @keyframes cardFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

        .app-card::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent 0%, rgba(0, 240, 255, 0.15) 50%, transparent 100%); animation: cardSweep 4s ease-in-out infinite; pointer-events: none; }
        .app-card:nth-child(1)::after { animation-delay: 0s; } .app-card:nth-child(2)::after { animation-delay: 0.7s; }
        .app-card:nth-child(3)::after { animation-delay: 1.4s; } .app-card:nth-child(4)::after { animation-delay: 2.1s; }
        .app-card:nth-child(5)::after { animation-delay: 2.8s; }
        @keyframes cardSweep { 0% { left: -100%; } 50%, 100% { left: 100%; } }

        .app-card::before { content: ''; position: absolute; inset: 0; background: var(--grad-primary); opacity: 0; transition: opacity 0.3s; z-index: -1; }
        .app-card:hover, .app-card:active { transform: translateY(-8px) scale(1.03); border-color: var(--cyan); box-shadow: 0 15px 40px rgba(0, 240, 255, 0.4), 0 0 30px rgba(0, 240, 255, 0.3), inset 0 0 25px rgba(0, 240, 255, 0.1); animation-play-state: paused; }
        .app-card:hover::before { opacity: 0.08; }

        .app-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.7rem; background: rgba(0, 240, 255, 0.12); border: 1.5px solid rgba(0, 240, 255, 0.4); position: relative; transition: all 0.3s ease; }
        .app-icon::before { content: ''; position: absolute; inset: -4px; border-radius: 14px; background: inherit; opacity: 0.4; z-index: -1; animation: iconHalo 2s ease-in-out infinite; }
        .app-card:nth-child(1) .app-icon::before { animation-delay: 0s; } .app-card:nth-child(2) .app-icon::before { animation-delay: 0.4s; }
        .app-card:nth-child(3) .app-icon::before { animation-delay: 0.8s; } .app-card:nth-child(4) .app-icon::before { animation-delay: 1.2s; }
        .app-card:nth-child(5) .app-icon::before { animation-delay: 1.6s; }
        @keyframes iconHalo { 0%, 100% { transform: scale(1); opacity: 0.3; } 50% { transform: scale(1.15); opacity: 0.7; } }
        .app-card:hover .app-icon { transform: scale(1.1); box-shadow: 0 0 20px currentColor; }

        @media (max-width: 620px) {
            .app-card { flex: 0 0 calc(33.333% - 11px); min-width: 100px; padding: 14px 8px; gap: 8px; }
            .app-icon { width: 38px; height: 38px; font-size: 1.3rem; border-radius: 10px; }
        }
        .app-name { font-family: 'Orbitron', sans-serif; font-size: 0.78rem; font-weight: 700; text-align: center; letter-spacing: 0.5px; word-break: break-word; color: var(--text); text-shadow: 0 0 8px rgba(0, 240, 255, 0.3); }
        @media (max-width: 620px) { .app-name { font-size: 0.62rem; } }
        .app-desc { font-size: 0.62rem; color: var(--text-dim); text-align: center; line-height: 1.3; }
        @media (max-width: 620px) { .app-desc { display: none; } }

        .app-card[data-app="bauth"] { border-color: rgba(0, 240, 255, 0.4); box-shadow: 0 0 15px rgba(0, 240, 255, 0.2), inset 0 0 20px rgba(0, 240, 255, 0.05); }
        .app-card[data-app="bauth"] .app-icon { background: rgba(0, 240, 255, 0.15); border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 12px rgba(0, 240, 255, 0.4); }
        .app-card[data-app="bgenpass"] { border-color: rgba(0, 255, 136, 0.4); box-shadow: 0 0 15px rgba(0, 255, 136, 0.2), inset 0 0 20px rgba(0, 255, 136, 0.05); }
        .app-card[data-app="bgenpass"] .app-icon { background: rgba(0, 255, 136, 0.15); border-color: var(--green); color: var(--green); box-shadow: 0 0 12px rgba(0, 255, 136, 0.4); }
        .app-card[data-app="bkeepnotes"] { border-color: rgba(255, 183, 3, 0.4); box-shadow: 0 0 15px rgba(255, 183, 3, 0.2), inset 0 0 20px rgba(255, 183, 3, 0.05); }
        .app-card[data-app="bkeepnotes"] .app-icon { background: rgba(255, 183, 3, 0.15); border-color: var(--yellow); color: var(--yellow); box-shadow: 0 0 12px rgba(255, 183, 3, 0.4); }
        .app-card[data-app="bpgp"] { border-color: rgba(212, 175, 55, 0.4); box-shadow: 0 0 15px rgba(212, 175, 55, 0.2), inset 0 0 20px rgba(212, 175, 55, 0.05); }
        .app-card[data-app="bpgp"] .app-icon { background: rgba(212, 175, 55, 0.15); border-color: #d4af37; color: #d4af37; box-shadow: 0 0 12px rgba(212, 175, 55, 0.4); }
        .app-card[data-app="bstegano"] { border-color: rgba(168, 85, 247, 0.4); box-shadow: 0 0 15px rgba(168, 85, 247, 0.2), inset 0 0 20px rgba(168, 85, 247, 0.05); }
        .app-card[data-app="bstegano"] .app-icon { background: rgba(168, 85, 247, 0.15); border-color: var(--violet); color: var(--violet); box-shadow: 0 0 12px rgba(168, 85, 247, 0.4); }

        /* ===== APP CONTAINER ===== */
        .app-container { display: none; width: 100%; height: 100%; position: fixed; inset: 0; background: var(--bg); z-index: 500; }
        .app-container.active { display: block; }
        .app-iframe { width: 100%; height: 100%; border: none; background: transparent; display: block; }

        /* ===== BOUTON MAISON ===== */
        .home-btn {
            position: fixed; bottom: max(14px, env(safe-area-inset-bottom, 14px)); left: 14px; width: 36px; height: 36px;
            border-radius: 50%; background: linear-gradient(135deg, rgba(0, 240, 255, 0.15) 0%, rgba(168, 85, 247, 0.2) 100%);
            border: 1px solid rgba(168, 85, 247, 0.35); color: rgba(0, 240, 255, 0.5); display: none;
            align-items: center; justify-content: center; cursor: pointer; z-index: 9999;
            backdrop-filter: blur(6px); box-shadow: 0 0 10px rgba(168, 85, 247, 0.25);
            transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;
            -webkit-tap-highlight-color: transparent; touch-action: manipulation; padding: 0;
        }
        .home-btn.visible { display: flex; animation: homeBtnBlink 4s ease-in-out infinite; }
        @keyframes homeBtnBlink {
            0% { opacity: 0.15; box-shadow: 0 0 4px rgba(0, 240, 255, 0.1); }
            50% { opacity: 0.9; box-shadow: 0 0 16px rgba(0, 240, 255, 0.4), 0 0 25px rgba(168, 85, 247, 0.7); border-color: rgba(168, 85, 247, 0.6); }
            100% { opacity: 0.15; box-shadow: 0 0 4px rgba(0, 240, 255, 0.1); }
        }
        .home-btn:hover, .home-btn:active { animation: none !important; opacity: 1; background: linear-gradient(135deg, #00f0ff 0%, #a855f7 100%); color: #fff; border-color: transparent; transform: scale(1.15); box-shadow: 0 0 20px rgba(168, 85, 247, 0.7), 0 0 30px rgba(0, 240, 255, 0.5); }
        .home-btn svg { width: 15px; height: 15px; pointer-events: none; }

        /* ===== SPLASH ===== */
        .splash {
            position: fixed; inset: 0; background: var(--bg); z-index: 99999;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px;
            transition: opacity 0.5s, visibility 0.5s;
        }
        .splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .splash-logo {
            font-family: 'Orbitron', sans-serif; font-size: clamp(2rem, 8vw, 3rem); font-weight: 900;
            background: linear-gradient(135deg, #00f0ff 0%, #a855f7 50%, #ff0055 100%);
            background-size: 200% 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 6px; animation: titleShift 3s ease-in-out infinite, splashGlow 1s ease-in-out infinite alternate;
        }

    .field input, .field textarea { padding: clamp(8px, 1.2vw, 11px); background: rgba(100, 100, 100, 0.03); border: 1px solid rgba(168, 85, 247, 0.3); color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: clamp(0.75rem, 1.2vw, 0.85rem); outline: none; border-radius: 4px; user-select: text; }
    .field textarea { resize: vertical; min-height: 60px; }
    .field input:focus, .field textarea:focus { border-color: var(--cyan); box-shadow: 0 0 8px rgba(0, 240, 255, 0.3); }
    .dialog-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
    .btn-sec { background: transparent; color: var(--text-dim); border: 1px solid var(--text-dim); padding: 8px 12px; font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; cursor: pointer; border-radius: 4px; }
    .btn-sec:hover { color: var(--text); border-color: var(--text); }
    .btn-danger-action { background: rgba(255, 0, 85, 0.15); color: var(--pink); border: 1px solid var(--pink); padding: 8px 12px; font-family: 'Orbitron', sans-serif; font-size: 0.7rem; font-weight: 700; cursor: pointer; border-radius: 4px; }
    .btn-danger-action:hover { background: var(--pink); color: #fff; box-shadow: 0 0 10px var(--pink); }
    #confirm-msg { font-size: clamp(0.75rem, 1.2vw, 0.85rem); color: var(--text); margin: 8px 0; text-align: center; line-height: 1.5; }
    .highlight-danger { color: var(--pink); font-weight: 700; text-shadow: 0 0 8px rgba(255, 0, 85, 0.5); }
    .highlight-service { font-family: 'Orbitron', sans-serif; font-weight: 700; background: var(--grad-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .toast { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); left: 50%; transform: translate(-50%, 100px); background: var(--grad-primary); color: #fff; padding: 8px 16px; font-weight: 700; font-size: clamp(0.65rem, 1.2vw, 0.75rem); border-radius: 20px; box-shadow: 0 0 15px rgba(168, 85, 247, 0.5); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 700; white-space: nowrap; }
    .toast.show { transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <div class="intro-splash" id="intro-splash">
    <div class="hud-container">
      <div class="hud-ring"></div>
      <div class="hud-ring-inner"></div>
      <div class="hud-core">B</div>
    </div>
    <div class="intro-info">
      <div class="intro-logo-text">B AUTH</div>
      <div class="intro-status" id="intro-status">> INITIALIZING KERNEL...</div>
      <div class="intro-bar-container">
        <div class="intro-bar-progress" id="intro-progress"></div>
      </div>
    </div>
  </div>
  <div class="app">
    <div class="header">
      <h1>B AUTH</h1>
      <div class="header-actions">
        <button class="btn-cyber" id="btn-censor" onclick="toggleCensor()" title="Masquer / Afficher les codes">👁️‍🗨️</button>
        <button class="btn-cyber" id="btn-theme" onclick="toggleTheme()" title="Mode clair / sombre">🌙</button>
        <button class="btn-cyber" id="btn-density" onclick="toggleDensity()" title="Changer le mode d'affichage"></button>
        <button class="btn-cyber" onclick="exportData()" title="Sauvegarder">💾</button>
        <button class="btn-cyber" onclick="importData()" title="Restaurer">📥</button>
        <div class="btn-glow-wrapper">
          <button class="btn-cyber" onclick="openAddModal()">+ CLE</button>
        </div>
      </div>
    </div>
    <div class="controls-bar">
      <input type="text" class="search-input" id="search" placeholder="[ RECHERCHER... ]" oninput="render(true)">
      <div class="tags-bar" id="tags-bar"></div>
    </div>
    <div class="accounts-list-container">
      <div class="accounts-list" id="list"></div>
    </div>
  </div>
  <div class="dialog-backdrop" id="ctx-menu-backdrop" onclick="closeContextMenu()">
    <div class="dialog-box" onclick="event.stopPropagation()">
      <h3 id="ctx-title">OPTION COMPTE</h3>
      <div class="menu-item" onclick="togglePinFromCtx()">
        <span id="ctx-pin-icon">📌</span> <span id="ctx-pin-text">Épingler en haut</span>
      </div>
      <div class="menu-item" onclick="moveAccount(-1)">⬆️ Monter d'un cran</div>
      <div class="menu-item" onclick="moveAccount(1)">⬇️ Descendre d'un cran</div>
      <div class="menu-item" onclick="openEditModalFromCtx()">✏️ Éditer les informations</div>
      <div class="menu-item" onclick="copySecretFromCtx()">🔑 Copier la clé secrète</div>
      <div class="menu-item danger" onclick="deleteFromCtx()">🗑️ Supprimer le compte</div>
    </div>
  </div>
  <div class="dialog-backdrop" id="modal">
    <div class="dialog-box">
      <h3 id="modal-title">// AJOUTER UNE CLE</h3>
      <input type="hidden" id="in-id">
      <div class="field">
        <label>SERVICE (ex: Google, GitHub)</label>
        <input type="text" id="in-issuer" placeholder="GitHub">
      </div>
      <div class="field">
        <label>IDENTIFIANT / EMAIL</label>
        <input type="text" id="in-account" placeholder="user@net.com">
      </div>
      <div class="field">
        <label>LOGO PERSONNALISÉ (URL ou Fichier)</label>
        <div style="display: flex; gap: 6px;">
          <input type="text" id="in-icon" placeholder="https://... ou charger un fichier" style="flex:1;">
          <input type="file" id="in-icon-file" accept="image/*" style="display:none" onchange="handleLogoFile(event)">
          <button class="btn-sec" type="button" onclick="document.getElementById('in-icon-file').click()" style="white-space: nowrap;">📁 Fichier</button>
        </div>
      </div>
      <div class="field">
        <label>CLE SECRETE (Base32)</label>
        <div style="display: flex; gap: 6px;">
          <input type="password" id="in-secret" placeholder="JBSWY3DPEHPK3PXP" style="flex:1;">
          <button class="btn-sec" type="button" id="btn-toggle-secret" onclick="toggleSecretVisibility()" title="Afficher / Masquer la clé">👁️</button>
        </div>
      </div>
      <div class="field">
        <label>NOTE PERSONNELLE</label>
        <textarea id="in-note" placeholder="Ex: Compte de secours, clé API secondaire..."></textarea>
      </div>
      <div class="field">
        <label>ÉTIQUETTES / TAGS (Séparés par des virgules)</label>
        <input type="text" id="in-tags" placeholder="Pro, Perso, Crypto">
      </div>
      <div class="dialog-btns">
        <button class="btn-sec" onclick="closeModal()">ANNULER</button>
        <button class="btn-cyber" onclick="saveAccount()">ENREGISTRER</button>
      </div>
    </div>
  </div>
  <div class="dialog-backdrop" id="confirm-modal">
    <div class="dialog-box">
      <h3>// CONFIRMATION</h3>
      <p id="confirm-msg"></p>
      <div class="dialog-btns">
        <button class="btn-sec" onclick="closeConfirmModal(false)">ANNULER</button>
        <button class="btn-danger-action" id="confirm-ok-btn">SUPPRIMER</button>
      </div>
    </div>
  </div>
  <input type="file" id="file-input" style="display:none" onchange="handleFileImport(event)" accept=".json">
  <div class="toast" id="toast">> ACTION EFFECTUEE</div>
  <script>
    let accounts = JSON.parse(localStorage.getItem('b_auth_accounts') || '[]');
    let compactMode = JSON.parse(localStorage.getItem('b_auth_compact') || 'false');
    let isLightMode = JSON.parse(localStorage.getItem('b_auth_light') || 'false');
    let isCensored = JSON.parse(localStorage.getItem('b_auth_censored') || 'false');
    let activeTag = 'ALL';
    let selectedAccountId = null;
    let longPressTimer = null;
    let confirmCallback = null;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      if (type === 'click') { osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(400, now + 0.05); gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.05); osc.start(now); osc.stop(now + 0.05); }
      else if (type === 'copy') { osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.06); osc.frequency.setValueAtTime(1046.50, now + 0.12); gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2); osc.start(now); osc.stop(now + 0.2); }
      else if (type === 'delete') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(80, now + 0.18); gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.18); osc.start(now); osc.stop(now + 0.18); }
      else if (type === 'open') { osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.08); gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.08); osc.start(now); osc.stop(now + 0.08); }
    }
    window.addEventListener('pointerdown', () => { if (audioCtx.state === 'suspended') audioCtx.resume(); }, { once: true });
    function saveToStorage() { localStorage.setItem('b_auth_accounts', JSON.stringify(accounts)); }
    function toggleTheme() { playSound('click'); isLightMode = !isLightMode; localStorage.setItem('b_auth_light', JSON.stringify(isLightMode)); applyTheme(); }
    function applyTheme() {
      const btnTheme = document.getElementById('btn-theme');
      if (isLightMode) { document.body.classList.add('light-theme'); btnTheme.textContent = '☀️'; }
      else { document.body.classList.remove('light-theme'); btnTheme.textContent = '🌙'; }
      applyCensorUI();
    }
    function toggleCensor() { playSound('click'); isCensored = !isCensored; localStorage.setItem('b_auth_censored', JSON.stringify(isCensored)); applyCensorUI(); render(true); showToast(isCensored ? 'Codes masqués' : 'Codes affichés'); }
    function applyCensorUI() {
      const btnCensor = document.getElementById('btn-censor');
      if (btnCensor) {
        btnCensor.textContent = isCensored ? '🔒' : '👁️‍🗨️';
        btnCensor.style.borderColor = isCensored ? 'var(--violet)' : 'var(--cyan)';
        btnCensor.style.color = isCensored ? 'var(--violet)' : 'var(--cyan)';
      }
    }
    function toggleDensity() { playSound('click'); compactMode = !compactMode; localStorage.setItem('b_auth_compact', JSON.stringify(compactMode)); render(true); }
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = '> ' + msg.toUpperCase();
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    function copyToClipboard(text, message = 'Code copié !') {
      playSound('copy');
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => showToast(message)).catch(() => fallbackCopy(text, message));
      } else { fallbackCopy(text, message); }
    }
    function fallbackCopy(text, message) {
      const textarea = document.createElement('textarea');
      textarea.value = text; textarea.style.position = 'fixed'; textarea.style.opacity = '0';
      document.body.appendChild(textarea); textarea.focus(); textarea.select();
      try { document.execCommand('copy'); showToast(message); } catch (err) { showToast('Erreur de copie'); }
      document.body.removeChild(textarea);
    }
    function showConfirm(msgHtml, onOk) {
      playSound('open');
      document.getElementById('confirm-msg').innerHTML = msgHtml;
      confirmCallback = onOk;
      document.getElementById('confirm-modal').classList.add('open');
    }
    function closeConfirmModal(confirmed) {
      playSound('click');
      document.getElementById('confirm-modal').classList.remove('open');
      if (confirmed && typeof confirmCallback === 'function') confirmCallback();
      confirmCallback = null;
    }
    document.getElementById('confirm-ok-btn').onclick = () => closeConfirmModal(true);
    function resetSecretField() { document.getElementById('in-secret').type = 'password'; document.getElementById('btn-toggle-secret').textContent = '👁️'; }
    function toggleSecretVisibility() {
      playSound('click');
      const secretInput = document.getElementById('in-secret');
      const btn = document.getElementById('btn-toggle-secret');
      if (secretInput.type === 'password') { secretInput.type = 'text'; btn.textContent = '🔒'; }
      else { secretInput.type = 'password'; btn.textContent = '👁️'; }
    }
    function openAddModal() {
      playSound('open');
      document.getElementById('modal-title').textContent = '// AJOUTER UNE CLE';
      document.getElementById('in-id').value = '';
      document.getElementById('in-issuer').value = '';
      document.getElementById('in-account').value = '';
      document.getElementById('in-icon').value = '';
      document.getElementById('in-secret').value = '';
      resetSecretField();
      document.getElementById('in-note').value = '';
      document.getElementById('in-tags').value = '';
      document.getElementById('modal').classList.add('open');
    }
    function openEditModal(acc) {
      playSound('open');
      document.getElementById('modal-title').textContent = '// EDITER LA CLE';
      document.getElementById('in-id').value = acc.id;
      document.getElementById('in-issuer').value = acc.issuer || '';
      document.getElementById('in-account').value = acc.account || '';
      document.getElementById('in-icon').value = acc.icon || '';
      document.getElementById('in-secret').value = acc.secret || '';
      resetSecretField();
      document.getElementById('in-note').value = acc.note || '';
      document.getElementById('in-tags').value = (acc.tags || []).join(', ');
      document.getElementById('modal').classList.add('open');
    }
    function closeModal() { playSound('click'); document.getElementById('modal').classList.remove('open'); }
    function handleLogoFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => { document.getElementById('in-icon').value = event.target.result; showToast('Image chargée'); };
      reader.readAsDataURL(file);
    }
    function saveAccount() {
      playSound('click');
      const id = document.getElementById('in-id').value;
      const issuer = document.getElementById('in-issuer').value.trim();
      const account = document.getElementById('in-account').value.trim();
      const icon = document.getElementById('in-icon').value.trim();
      const secret = document.getElementById('in-secret').value.replace(/\s+/g, '').toUpperCase();
      const note = document.getElementById('in-note').value.trim();
      const tagsRaw = document.getElementById('in-tags').value;
      const tags = tagsRaw.split(',').map(t => t.trim()).filter(t => t.length > 0);
      if (!secret) return;
      if (id) {
        const idx = accounts.findIndex(a => a.id == id);
        if (idx !== -1) accounts[idx] = { ...accounts[idx], issuer, account, icon, secret, note, tags };
      } else {
        accounts.push({ id: Date.now(), issuer, account, icon, secret, note, tags, pinned: false });
      }
      saveToStorage(); closeModal(); render(true); showToast('Clé enregistrée');
    }
    function openContextMenu(acc) {
      playSound('open');
      selectedAccountId = acc.id;
      document.getElementById('ctx-title').textContent = (acc.issuer || 'COMPTE').toUpperCase();
      document.getElementById('ctx-pin-text').textContent = acc.pinned ? 'Désépingler' : 'Épingler en haut';
      document.getElementById('ctx-pin-icon').textContent = acc.pinned ? '📌' : '📍';
      document.getElementById('ctx-menu-backdrop').classList.add('open');
    }
    function closeContextMenu() { playSound('click'); document.getElementById('ctx-menu-backdrop').classList.remove('open'); selectedAccountId = null; }
    function togglePinFromCtx() {
      const acc = accounts.find(a => a.id === selectedAccountId);
      if (acc) { acc.pinned = !acc.pinned; saveToStorage(); render(true); showToast(acc.pinned ? 'Compte épinglé' : 'Compte désépinglé'); }
      closeContextMenu();
    }
    function moveAccount(direction) {
      const idx = accounts.findIndex(a => a.id === selectedAccountId);
      if (idx !== -1) {
        const newIdx = idx + direction;
        if (newIdx >= 0 && newIdx < accounts.length) {
          const item = accounts.splice(idx, 1)[0];
          accounts.splice(newIdx, 0, item);
          saveToStorage(); render(true); showToast('Ordre mis à jour');
        }
      }
      closeContextMenu();
    }
    function openEditModalFromCtx() { const acc = accounts.find(a => a.id === selectedAccountId); closeContextMenu(); if (acc) openEditModal(acc); }
    function copySecretFromCtx() { const acc = accounts.find(a => a.id === selectedAccountId); closeContextMenu(); if (acc) copyToClipboard(acc.secret, 'Clé secrète copiée'); }
    function deleteFromCtx() {
      const acc = accounts.find(a => a.id === selectedAccountId);
      closeContextMenu();
      if (acc) {
        const name = acc.issuer || 'ce compte';
        const msg = 'Voulez-vous supprimer <span class="highlight-danger">définitivement</span><br><span class="highlight-service">' + name + '</span> ?';
        showConfirm(msg, () => {
          playSound('delete');
          accounts = accounts.filter(a => a.id !== acc.id);
          saveToStorage(); render(true); showToast('Compte supprimé');
        });
      }
    }
    function getOTPPair(secret) {
      try {
        const totp = new OTPAuth.TOTP({ secret: OTPAuth.Secret.fromBase32(secret) });
        const now = Date.now();
        const cur = totp.generate({ timestamp: now });
        const nxt = totp.generate({ timestamp: now + 30000 });
        const curFormatted = cur.slice(0, 3) + ' ' + cur.slice(3);
        const nxtFormatted = nxt.slice(0, 3) + ' ' + nxt.slice(3);
        return { current: isCensored ? '••• •••' : curFormatted, currentRaw: cur, next: isCensored ? '••• •••' : nxtFormatted };
      } catch (e) { return { current: 'ERREUR', currentRaw: '', next: '------' }; }
    }
    function getServiceDomain(issuer) {
      if (!issuer) return '';
      let clean = issuer.toLowerCase().trim();
      const map = { 'google': 'google.com', 'github': 'github.com', 'discord': 'discord.com', 'facebook': 'facebook.com', 'twitter': 'x.com', 'x': 'x.com', 'microsoft': 'microsoft.com', 'apple': 'apple.com', 'amazon': 'amazon.com', 'cloudflare': 'cloudflare.com', 'bitwarden': 'bitwarden.com', 'twitch': 'twitch.tv', 'steam': 'steampowered.com', 'proton': 'proton.me', 'gitlab': 'gitlab.com' };
      if (map[clean]) return map[clean];
      return clean.replace(/[^a-z0-9]/g, '') + '.com';
    }
    function render(forceRebuild = false) {
      const q = document.getElementById('search').value.toLowerCase();
      const list = document.getElementById('list');
      const btnDensity = document.getElementById('btn-density');
      if (compactMode) { list.classList.add('compact'); btnDensity.textContent = '☵'; }
      else { list.classList.remove('compact'); btnDensity.textContent = '☰'; }
      const allTags = new Set();
      accounts.forEach(a => (a.tags || []).forEach(t => allTags.add(t)));
      const tagsBar = document.getElementById('tags-bar');
      tagsBar.innerHTML = '<div class="tag-chip ' + (activeTag === 'ALL' ? 'active' : '') + '" onclick="filterTag(\'ALL\')">TOUS</div>';
      allTags.forEach(t => { tagsBar.innerHTML += '<div class="tag-chip ' + (activeTag === t ? 'active' : '') + '" onclick="filterTag(\'' + t + '\')">#' + t + '</div>'; });
      const secondsLeft = 30 - (Math.floor(Date.now() / 1000) % 30);
      const progressPercent = (secondsLeft / 30) * 100;
      const filteredAccounts = [...accounts]
        .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0))
        .filter(a => {
          const matchSearch = (a.issuer || '').toLowerCase().includes(q) || (a.account || '').toLowerCase().includes(q) || (a.note || '').toLowerCase().includes(q);
          const matchTag = activeTag === 'ALL' || (a.tags || []).includes(activeTag);
          return matchSearch && matchTag;
        });
      const existingCards = list.querySelectorAll('.card');
      if (forceRebuild || existingCards.length !== filteredAccounts.length) {
        list.innerHTML = '';
        filteredAccounts.forEach(a => {
          const card = document.createElement('div');
          card.className = 'card ' + (a.pinned ? 'pinned' : '');
          card.dataset.id = a.id;
          card.onmousedown = (e) => { if (e.button === 0) { longPressTimer = setTimeout(() => { openContextMenu(a); longPressTimer = null; }, 450); } };
          card.onmouseup = () => { if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } };
          card.ontouchstart = () => { longPressTimer = setTimeout(() => { openContextMenu(a); longPressTimer = null; }, 450); };
          card.ontouchend = () => { if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } };
          card.oncontextmenu = (e) => { e.preventDefault(); openContextMenu(a); };
          const tagsHtml = (a.tags || []).map(t => '<span class="card-tag">#' + t + '</span>').join('');
          const noteHtml = a.note ? '<div class="card-note">💬 ' + a.note + '</div>' : '';
          const domain = getServiceDomain(a.issuer);
          const initial = (a.issuer || 'S').charAt(0).toUpperCase();
          let iconHtml = '';
          if (a.icon && a.icon.trim() !== '') {
            iconHtml = '<img src="' + a.icon + '" class="service-icon" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';">';
          } else {
            iconHtml = '<img src="https://www.google.com/s2/favicons?domain=' + domain + '&sz=32" class="service-icon" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';">';
          }
          card.innerHTML = `
            <div class="card-top"><div style="width: 100%;">
              <div class="issuer-group">
                ${a.pinned ? '<span class="pin-badge">📌</span>' : ''}
                ${iconHtml}
                <div class="service-initial" style="display:none;">${initial}</div>
                <div class="issuer">${a.issuer || 'SERVICE'}</div>
                <div class="account-name">${a.account || ''}</div>
              </div>
              ${noteHtml}
              <div class="card-tags">${tagsHtml}</div>
            </div></div>
            <div class="codes-container" id="code-box-${a.id}">
              <div>
                <div class="code-label">// ACTUEL (<span class="sec-label">${secondsLeft}</span>s)</div>
                <div class="code-main"></div>
              </div>
              <div class="code-next-box">
                <div class="code-label" style="color: var(--pink)">// SUIVANT</div>
                <div class="code-next"></div>
              </div>
            </div>
            <div class="laser-progress"></div>`;
          const codeContainer = card.querySelector('#code-box-' + a.id);
          codeContainer.onclick = (e) => { e.stopPropagation(); const otp = getOTPPair(a.secret); copyToClipboard(otp.currentRaw, 'Code copié !'); };
          list.appendChild(card);
        });
      }
      const cardElements = list.querySelectorAll('.card');
      cardElements.forEach((cardEl, index) => {
        const a = filteredAccounts[index];
        if (!a) return;
        const otp = getOTPPair(a.secret);
        const codeMain = cardEl.querySelector('.code-main');
        const codeNext = cardEl.querySelector('.code-next');
        const secLabel = cardEl.querySelector('.sec-label');
        const progressBar = cardEl.querySelector('.laser-progress');
        if (codeMain) codeMain.textContent = otp.current;
        if (codeNext) codeNext.textContent = otp.next;
        if (secLabel) secLabel.textContent = secondsLeft;
        if (progressBar) progressBar.style.width = progressPercent + '%';
      });
    }
    function filterTag(tag) { playSound('click'); activeTag = tag; render(true); }

                lengthSlider.value = mode === "wifi" ? 20 : 16;
            } else {
                standardOptions.style.display = "none"; ambiguousOption.style.display = "none"; separatorOption.style.display = "flex";
                lengthLabel.textContent = "Mots (EFF)"; lengthSlider.min = 4; lengthSlider.max = 12; lengthSlider.value = 5;
            }
            updateLength(); generatePassword();
        }
        function updateLength() { lengthVal.textContent = lengthSlider.value; }
        function generatePassword() {
            let password = "";
            if (currentMode === "passphrase") {
                const wordCount = parseInt(lengthSlider.value, 10);
                const sep = separatorSelect.value;
                let selectedWords = [];
                for (let i = 0; i < wordCount; i++) selectedWords.push(effWordlist[getSecureRandomInt(effWordlist.length)]);
                password = selectedWords.join(sep);
            } else {
                let categories = [];
                let upper = chars.uppercase, lower = chars.lowercase, num = chars.numbers, sym = chars.symbols;
                if (excludeAmbiguousEl.checked) { upper = upper.replace(/[IO]/g, ""); lower = lower.replace(/[l]/g, ""); num = num.replace(/[01]/g, ""); }
                if (uppercaseEl.checked) categories.push(upper);
                if (lowercaseEl.checked) categories.push(lower);
                if (numbersEl.checked) categories.push(num);
                if (symbolsEl.checked) categories.push(sym);
                if (categories.length === 0) { uppercaseEl.checked = true; categories.push(upper); }
                let passArray = [];
                categories.forEach(cat => passArray.push(cat[getSecureRandomInt(cat.length)]));
                const allChars = categories.join("");
                const targetLength = parseInt(lengthSlider.value, 10);
                while (passArray.length < targetLength) passArray.push(allChars[getSecureRandomInt(allChars.length)]);
                for (let i = passArray.length - 1; i > 0; i--) { const j = getSecureRandomInt(i + 1); [passArray[i], passArray[j]] = [passArray[j], passArray[i]]; }
                password = passArray.join("");

            evaluatePassword(password); playCyberSound('generate');
        }
        function calculateCrackTime(entropy) {
            if (entropy <= 0) return "Instantané";
            const guessesPerSecond = 1e10;
            const seconds = Math.pow(2, entropy) / guessesPerSecond;
            if (seconds < 1) return "Instantané";
            if (seconds < 60) return Math.round(seconds) + " s";
            if (seconds < 3600) return Math.round(seconds / 60) + " min";
            if (seconds < 86400) return Math.round(seconds / 3600) + " h";
            if (seconds < 31536000) return Math.round(seconds / 86400) + " j";
            const years = seconds / 31536000;
            if (years < 100) return Math.round(years) + " an(s)";
            if (years < 10000) return Math.round(years / 100) + " siècle(s)";
            return "+1 Mda d'années";
        }
        function analyzePatterns(password) {
            let penalty = 0, warnings = [];
            const lower = password.toLowerCase();
            ["123456789", "qwertyuiop", "azertyuiop", "abcdefghijklmnopqrstuvwxyz"].forEach(seq => {
                for (let i = 0; i < seq.length - 2; i++) { const sub = seq.substring(i, i + 3); if (lower.includes(sub)) { penalty += 18; warnings.push("Séquence ('" + sub + "')"); } }
            });
            if (/(.)\1{2,}/.test(password)) { penalty += 15; warnings.push("Répétitions"); }
            if (/(19|20)\d{2}/.test(password)) { penalty += 12; warnings.push("Motif d'année"); }
            return { penalty, warnings: [...new Set(warnings)] };
        }
        function evaluatePassword(password) {
            patternsWarning.textContent = "";
            document.getElementById("crit-upper").classList.toggle("active", /[A-Z]/.test(password));
            document.getElementById("crit-lower").classList.toggle("active", /[a-z]/.test(password));
            document.getElementById("crit-num").classList.toggle("active", /[0-9]/.test(password));
            document.getElementById("crit-sym").classList.toggle("active", /[^A-Za-z0-9]/.test(password));
            if (!password) { resetMetrics(); return; }
            let entropy = 0;
            if (currentMode === "passphrase" && (password.includes("-") || password.includes("_") || password.includes(".") || password.includes(" "))) {
                const words = password.split(separatorSelect.value);
                entropy = Math.round(words.length * 12.92);
            } else {
                let poolSize = 0;
                if (/[a-z]/.test(password)) poolSize += 26;
                if (/[A-Z]/.test(password)) poolSize += 26;
                if (/[0-9]/.test(password)) poolSize += 10;

            debounceTimer = setTimeout(() => checkPwnedLeak(password), 400);
        }
        async function checkPwnedLeak(password) {
            if (!password || password.length < 3) { pwnedVal.innerHTML = '<span class="badge badge-safe">Incomplet</span>'; return; }
            try {
                const hashBuffer = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(password));

                pwnedVal.innerHTML = count > 0 ? '<span class="badge badge-danger">Fuite (' + count.toLocaleString() + ')</span>' : '<span class="badge badge-safe">0 fuite</span>';
            } catch (e) { pwnedVal.innerHTML = '<span class="badge badge-warn">Bloqué / Offline</span>'; }
        }
        function resetMetrics() {
            entropyVal.textContent = "0 bits"; crackTimeVal.textContent = "-"; strengthVal.textContent = "-";
            pwnedVal.innerHTML = '<span class="badge badge-safe">Non vérifié</span>';

        });

        modePassphraseBtn.addEventListener("click", () => setMode("passphrase"));
        modeWifiBtn.addEventListener("click", () => setMode("wifi"));
        lengthSlider.addEventListener("input", () => { updateLength(); generatePassword(); });

    <script>
        const DB_NAME = 'BKeepNotesDB';
        const DB_VERSION = 2;
        let db = null;
        let currentPin1 = "1234";
        let currentPin2 = "6789";
        let activeVaultIndex = 1;
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains('notes')) database.createObjectStore('notes', { keyPath: 'id' });
                    if (!database.objectStoreNames.contains('privateNotes')) database.createObjectStore('privateNotes', { keyPath: 'id' });
                    if (!database.objectStoreNames.contains('privateNotes2')) database.createObjectStore('privateNotes2', { keyPath: 'id' });
                    if (!database.objectStoreNames.contains('passwords')) database.createObjectStore('passwords', { keyPath: 'id' });
                    if (!database.objectStoreNames.contains('meta')) database.createObjectStore('meta', { keyPath: 'key' });
                };
                request.onsuccess = (e) => { db = e.target.result; migrateFromLocalStorage().then(resolve); };
                request.onerror = (e) => reject(e);
            });
        }
        async function dbGetAll(storeName) { return new Promise((resolve, reject) => { const tx = db.transaction(storeName, 'readonly'); const store = tx.objectStore(storeName); const req = store.getAll(); req.onsuccess = () => resolve(req.result || []); req.onerror = (e) => reject(e); }); }
        async function dbPutAll(storeName, items) { return new Promise((resolve, reject) => { const tx = db.transaction(storeName, 'readwrite'); const store = tx.objectStore(storeName); store.clear().onsuccess = () => { let remaining = items.length; if (remaining === 0) resolve(); items.forEach(item => { store.put(item).onsuccess = () => { remaining--; if (remaining === 0) resolve(); }; }); }; tx.onerror = (e) => reject(e); }); }
        async function dbGetMeta(key, defaultValue) { return new Promise((resolve) => { const tx = db.transaction('meta', 'readonly'); const store = tx.objectStore('meta'); const req = store.get(key); req.onsuccess = () => resolve(req.result ? req.result.value : defaultValue); req.onerror = () => resolve(defaultValue); }); }
        async function dbSetMeta(key, value) { return new Promise((resolve, reject) => { const tx = db.transaction('meta', 'readwrite'); const store = tx.objectStore('meta'); const req = store.put({ key, value }); req.onsuccess = () => resolve(); req.onerror = (e) => reject(e); }); }
        async function migrateFromLocalStorage() {
            const oldNotes = localStorage.getItem('keep_notes_data');
            const oldFolders = localStorage.getItem('keep_folders_data');
            const oldPrivateNotes = localStorage.getItem('private_notes_data');
            const oldPrivateFolders = localStorage.getItem('private_folders_data');
            const oldPasswords = localStorage.getItem('keep_passwords_data');
            if (oldNotes) { await dbPutAll('notes', JSON.parse(oldNotes)); localStorage.removeItem('keep_notes_data'); }
            if (oldFolders) { await dbSetMeta('folders', JSON.parse(oldFolders)); localStorage.removeItem('keep_folders_data'); }
            if (oldPrivateNotes) { await dbPutAll('privateNotes', JSON.parse(oldPrivateNotes)); localStorage.removeItem('private_notes_data'); }
            if (oldPrivateFolders) { await dbSetMeta('privateFolders', JSON.parse(oldPrivateFolders)); localStorage.removeItem('private_folders_data'); }
            if (oldPasswords) { await dbPutAll('passwords', JSON.parse(oldPasswords)); localStorage.removeItem('keep_passwords_data'); }
        }
        const customModal = document.getElementById('custom-modal');
        const customModalTitle = document.getElementById('custom-modal-title');
        const customModalMessage = document.getElementById('custom-modal-message');
        const customModalInput = document.getElementById('custom-modal-input');
        const customModalBtnConfirm = document.getElementById('custom-modal-btn-confirm');
        const customModalBtnCancel = document.getElementById('custom-modal-btn-cancel');
        function customAlert(message, title = "Information") {
            return new Promise((resolve) => {
                customModalTitle.textContent = title; customModalMessage.textContent = message;
                customModalInput.classList.add('hidden'); customModalBtnCancel.classList.add('hidden');
                customModalBtnConfirm.textContent = "OK"; customModal.classList.remove('hidden');
                const onConfirm = () => { customModal.classList.add('hidden'); customModalBtnConfirm.removeEventListener('click', onConfirm); resolve(); };
                customModalBtnConfirm.addEventListener('click', onConfirm);
            });
        }
        function customConfirm(message, title = "Confirmation") {
            return new Promise((resolve) => {
                customModalTitle.textContent = title; customModalMessage.textContent = message;
                customModalInput.classList.add('hidden'); customModalBtnCancel.classList.remove('hidden');
                customModalBtnConfirm.textContent = "Confirmer"; customModalBtnCancel.textContent = "Annuler";
                customModal.classList.remove('hidden');
                const onConfirm = () => { cleanup(); resolve(true); };
                const onCancel = () => { cleanup(); resolve(false); };
                const cleanup = () => { customModal.classList.add('hidden'); customModalBtnConfirm.removeEventListener('click', onConfirm); customModalBtnCancel.removeEventListener('click', onCancel); };
                customModalBtnConfirm.addEventListener('click', onConfirm); customModalBtnCancel.addEventListener('click', onCancel);
            });
        }
        function customPrompt(message, defaultValue = "", title = "Saisie") {
            return new Promise((resolve) => {
                customModalTitle.textContent = title; customModalMessage.textContent = message;
                customModalInput.value = defaultValue; customModalInput.classList.remove('hidden');
                customModalBtnCancel.classList.remove('hidden'); customModalBtnConfirm.textContent = "Valider";
                customModalBtnCancel.textContent = "Annuler"; customModal.classList.remove('hidden');
                customModalInput.focus();
                const onConfirm = () => { const val = customModalInput.value; cleanup(); resolve(val); };
                const onCancel = () => { cleanup(); resolve(null); };
                const cleanup = () => { customModal.classList.add('hidden'); customModalBtnConfirm.removeEventListener('click', onConfirm); customModalBtnCancel.removeEventListener('click', onCancel); };
                customModalBtnConfirm.addEventListener('click', onConfirm); customModalBtnCancel.addEventListener('click', onCancel);
            });
        }
        const savedTheme = localStorage.getItem('app_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        function toggleTheme() { const current = document.documentElement.getAttribute('data-theme'); const next = current === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', next); localStorage.setItem('app_theme', next); }
        document.getElementById('btn-theme-facade').addEventListener('click', toggleTheme);
        document.getElementById('btn-theme-secret').addEventListener('click', toggleTheme);
        document.getElementById('btn-theme-private').addEventListener('click', toggleTheme);
        document.getElementById('btn-theme-private-drawer').addEventListener('click', toggleTheme);
        const viewFacade = document.getElementById('view-facade');
        const viewLock = document.getElementById('view-lock');
        const lockTitle = document.getElementById('lock-title');
        const viewSecret = document.getElementById('view-secret');
        const viewPrivateNotes = document.getElementById('view-private-notes');
        const viewPasswords = document.getElementById('view-passwords');
        const secretTrigger = document.getElementById('secret-trigger');
        const pinInput = document.getElementById('pin-input');
        const btnUnlock = document.getElementById('btn-unlock');
        const btnBackFacade = document.getElementById('btn-back-facade');
        const btnLockBack = document.getElementById('btn-lock-back');
        const btnLockPrivate = document.getElementById('btn-lock-private');
        const btnLockPasswords = document.getElementById('btn-lock-passwords');
        let lockTarget = 'secret';
        let clickCountSecret = 0, clickTimerSecret = null;
        secretTrigger.addEventListener('click', () => {
            clickCountSecret++; clearTimeout(clickTimerSecret);
            if (clickCountSecret === 3) { clickCountSecret = 0; lockTarget = 'secret'; lockTitle.textContent = "Accès Chiffrement"; appDrawer.classList.remove('open'); viewFacade.classList.add('hidden'); viewLock.classList.remove('hidden'); }
            else { clickTimerSecret = setTimeout(() => { clickCountSecret = 0; }, 400); }
        });
        document.getElementById('btn-open-private-notes').addEventListener('click', () => { lockTarget = 'private-notes'; lockTitle.textContent = "Accès Notes Privées"; appDrawer.classList.remove('open'); viewFacade.classList.add('hidden'); viewLock.classList.remove('hidden'); });
        document.getElementById('btn-open-passwords').addEventListener('click', () => { lockTarget = 'passwords'; lockTitle.textContent = "Coffre Mots de Passe"; appDrawer.classList.remove('open'); viewFacade.classList.add('hidden'); viewLock.classList.remove('hidden'); });
        document.getElementById('btn-change-pin').addEventListener('click', async () => {
            appDrawer.classList.remove('open');
            const choice = await customPrompt("Tape 1 pour le PIN principal :\nTape 2 pour le PIN caché :", "1", "Changer le code PIN");
            if (!choice) return;
            if (choice === "1") {
                const oldPin = await customPrompt("Code PIN principal actuel :", "", "Modification PIN 1");
                if (oldPin !== currentPin1) return await customAlert("Code PIN1 incorrect.", "Erreur");
                const newPin = await customPrompt("Nouveau code PIN 1 :", "", "Nouveau PIN 1");
                if (!newPin || !newPin.trim()) return await customAlert("Le code ne peut pas être vide.", "Erreur");
                currentPin1 = newPin.trim(); await dbSetMeta('user_pin1', currentPin1);
                await customAlert("Code PIN 1 modifié avec succès !", "Succès");
            } else if (choice === "2") {
                const oldPin = await customPrompt("Code PIN caché actuel :", "", "Modification PIN 2");
                if (oldPin !== currentPin2) return await customAlert("Code PIN2 incorrect.", "Erreur");
                const newPin = await customPrompt("Nouveau code PIN 2 :", "", "Nouveau PIN 2");
                if (!newPin || !newPin.trim()) return await customAlert("Le code ne peut pas être vide.", "Erreur");
                currentPin2 = newPin.trim(); await dbSetMeta('user_pin2', currentPin2);
                await customAlert("Code PIN 2 modifié avec succès !", "Succès");
            }
        });
        btnBackFacade.addEventListener('click', () => { viewLock.classList.add('hidden'); viewFacade.classList.remove('hidden'); pinInput.value = ''; });
        btnUnlock.addEventListener('click', async () => {
            const enteredPin = pinInput.value;
            if (lockTarget === 'private-notes') {
                if (enteredPin === currentPin1) { activeVaultIndex = 1; await loadPrivateVault(1); viewLock.classList.add('hidden'); pinInput.value = ''; viewPrivateNotes.classList.remove('hidden'); renderPrivateFoldersMenu(); renderPrivateGrid(); }
                else if (enteredPin === currentPin2) { activeVaultIndex = 2; await loadPrivateVault(2); viewLock.classList.add('hidden'); pinInput.value = ''; viewPrivateNotes.classList.remove('hidden'); renderPrivateFoldersMenu(); renderPrivateGrid(); }
                else { await customAlert("Code PIN incorrect.", "Erreur d'accès"); }
            } else if (lockTarget === 'secret') {
                if (enteredPin === currentPin1 || enteredPin === currentPin2) { viewLock.classList.add('hidden'); pinInput.value = ''; viewSecret.classList.remove('hidden'); }
                else { await customAlert("Code PIN incorrect.", "Erreur d'accès"); }

    <script>
        let currentView = 'home', currentTab = 'code';
        window.onload = function() { lucide.createIcons(); initTheme(); };
        function triggerPanicPurge() {
            document.querySelectorAll('input[type="text"], textarea').forEach(el => el.value = '');
            document.getElementById('decrypt-output-text').textContent = '';
            document.getElementById('key-length-counter').textContent = '0 / 24';
            document.getElementById('decrypt-key-length-counter').textContent = '0 / 24';
            document.getElementById('code-output-container').classList.add('hidden');
            document.getElementById('facade-output-container').classList.add('hidden');
            document.getElementById('decrypt-output-container').classList.add('hidden');
            document.getElementById('key-error-msg').classList.add('hidden');
            document.getElementById('decrypt-key-error-msg').classList.add('hidden');
            if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(''); }
            showToast("🚨 Purge complète effectuée !");
        }
        function deriveKeyPBKDF2(passphrase) {
            const salt = CryptoJS.enc.Utf8.parse("BpgpStaticSalt2026SecureVault");
            const key256Bits = CryptoJS.PBKDF2(passphrase, salt, { keySize: 256 / 32, iterations: 100000 });
            return key256Bits.toString();
        }
        function toggleCustomFacadeInput() {
            const selectVal = document.getElementById('facade-topic-select').value;
            document.getElementById('custom-facade-container').classList.toggle('hidden', selectVal !== 'custom');
        }
        function switchView(viewName) {
            currentView = viewName;
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-encrypt').classList.add('hidden');
            document.getElementById('view-decrypt').classList.add('hidden');
            ['home', 'encrypt', 'decrypt'].forEach(item => {
                const btn = document.getElementById('nav-' + item);
                btn.className = "flex flex-col items-center gap-1 text-gray-400 dark:text-zinc-500 hover:text-gold-500 transition-colors";
            });
            document.getElementById('view-' + viewName).classList.remove('hidden');
            document.getElementById('nav-' + viewName).className = "flex flex-col items-center gap-1 text-gold-500 font-semibold transition-colors";
        }
        function switchTab(tabName) {
            currentTab = tabName;
            const codeBtn = document.getElementById('subtab-code-btn');
            const facadeBtn = document.getElementById('subtab-facade-btn');
            const codeContent = document.getElementById('tab-code-content');
            const facadeContent = document.getElementById('tab-facade-content');
            if (tabName === 'code') {
                codeBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all text-zinc-900 dark:text-white bg-white dark:bg-zinc-900 shadow-sm";
                facadeBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all text-gray-500 dark:text-zinc-400";
                codeContent.classList.remove('hidden'); facadeContent.classList.add('hidden');
            } else {
                facadeBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all text-zinc-900 dark:text-white bg-white dark:bg-zinc-900 shadow-sm";
                codeBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all text-gray-500 dark:text-zinc-400";
                facadeContent.classList.remove('hidden'); codeContent.classList.add('hidden');
            }
        }
        function initTheme() {
            if (localStorage.theme === 'light') { document.documentElement.classList.remove('dark'); document.getElementById('theme-icon-dark').classList.remove('hidden'); document.getElementById('theme-icon-light').classList.add('hidden'); }
            else { document.documentElement.classList.add('dark'); document.getElementById('theme-icon-light').classList.remove('hidden'); document.getElementById('theme-icon-dark').classList.add('hidden'); }
        }
        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) { document.documentElement.classList.remove('dark'); localStorage.theme = 'light'; document.getElementById('theme-icon-dark').classList.remove('hidden'); document.getElementById('theme-icon-light').classList.add('hidden'); }
            else { document.documentElement.classList.add('dark'); localStorage.theme = 'dark'; document.getElementById('theme-icon-light').classList.remove('hidden'); document.getElementById('theme-icon-dark').classList.add('hidden'); }
        }
        function validateKeyInput() {
            const keyInput = document.getElementById('sec-key-input').value;
            const counter = document.getElementById('key-length-counter');
            const errorMsg = document.getElementById('key-error-msg');
            counter.textContent = keyInput.length + ' / 24';
            if (keyInput.length > 0 && keyInput.length < 24) { errorMsg.classList.remove('hidden'); counter.classList.add('text-red-500'); }
            else { errorMsg.classList.add('hidden'); counter.classList.remove('text-red-500'); }
        }
        function validateDecryptKeyInput() {
            const keyInput = document.getElementById('decrypt-sec-key-input').value;
            const counter = document.getElementById('decrypt-key-length-counter');
            const errorMsg = document.getElementById('decrypt-key-error-msg');
            counter.textContent = keyInput.length + ' / 24';
            if (keyInput.length > 0 && keyInput.length < 24) { errorMsg.classList.remove('hidden'); counter.classList.add('text-red-500'); }
            else { errorMsg.classList.add('hidden'); counter.classList.remove('text-red-500'); }
        }
        function generateStrongKey() {
            const charset = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=";
            let result = "";
            const randomValues = new Uint32Array(32);
            window.crypto.getRandomValues(randomValues);
            for (let i = 0; i < 32; i++) { result += charset[randomValues[i] % charset.length]; }
            document.getElementById('sec-key-input').value = result;
            validateKeyInput();
            showToast("Clé de 32 car. générée !");
        }
        const ZW_ZERO = '\u200B', ZW_ONE = '\u200C', ZW_SEP = '\u200D';
        function textToZeroWidth(text) {
            return text.split('').map(char => char.charCodeAt(0).toString(2).padStart(8, '0').split('').map(bit => bit === '0' ? ZW_ZERO : ZW_ONE).join('')).join(ZW_SEP);
        }
        function zeroWidthToText(zwText) {
            const zwChars = zwText.replace(/[^\u200B\u200C\u200D]/g, '');
            if (!zwChars) return '';
            return zwChars.split(ZW_SEP).map(block => {
                if (!block) return '';
                const binaryStr = block.split('').map(ch => ch === ZW_ZERO ? '0' : '1').join('');
                return String.fromCharCode(parseInt(binaryStr, 2));
            }).join('');
        }
        const FAÇADE_TEMPLATES = { resto: "Salut, est-ce que tu es disponible ce soir pour se faire une bonne pizza vers 20h ? Dis-moi si ça te convient !", foot: "N'oublie pas le match de ce soir à 21h. On se retrouve tous chez Thomas pour regarder la seconde mi-temps !", work: "Bonjour, j'ai mis à jour le compte-rendu de la réunion. Merci de vérifier les fichiers joints dès que possible.", weather: "Quel temps magnifique prévu pour ce week-end ! Tu as prévu de sortir un peu profiter du soleil ?" };
        function handleEncryptCode() {
            const rawKey = document.getElementById('sec-key-input').value;
            const message = document.getElementById('secret-msg-input').value;
            if (rawKey.length < 24) { showToast("Erreur: Clé < 24 caractères !"); validateKeyInput(); return; }
            if (!message.trim()) { showToast("Entrez un message à chiffrer !"); return; }
            try {
                const derivedKey = deriveKeyPBKDF2(rawKey);
                const encrypted = CryptoJS.AES.encrypt(message, derivedKey).toString();
                document.getElementById('code-output-text').value = encrypted;
                document.getElementById('code-output-container').classList.remove('hidden');
                showToast("Message chiffré avec succès !");
            } catch (e) { showToast("Erreur lors du chiffrement."); }
        }
        function handleEncryptFacade() {
            const rawKey = document.getElementById('sec-key-input').value;
            const message = document.getElementById('facade-secret-input').value;
            const topic = document.getElementById('facade-topic-select').value;
            const customCoverText = document.getElementById('custom-facade-input').value;
            if (rawKey.length < 24) { showToast("Erreur: Clé < 24 caractères !"); validateKeyInput(); return; }
            if (!message.trim()) { showToast("Entrez un message secret !"); return; }
            if (topic === 'custom' && !customCoverText.trim()) { showToast("Veuillez saisir votre texte de couverture !"); return; }
            try {
                const derivedKey = deriveKeyPBKDF2(rawKey);
                const encryptedCipher = CryptoJS.AES.encrypt(message, derivedKey).toString();
                const invisibleHiddenCipher = textToZeroWidth(encryptedCipher);
                let coverText = FAÇADE_TEMPLATES[topic] || FAÇADE_TEMPLATES.resto;
                if (topic === 'custom' && customCoverText.trim()) { coverText = customCoverText.trim(); }
                const firstSpaceIndex = coverText.indexOf(' ');
                const disguisedFacadeMessage = firstSpaceIndex !== -1 ? coverText.slice(0, firstSpaceIndex) + invisibleHiddenCipher + coverText.slice(firstSpaceIndex) : coverText + invisibleHiddenCipher;
                document.getElementById('facade-output-text').value = disguisedFacadeMessage;
                document.getElementById('facade-output-container').classList.remove('hidden');
                showToast("Façade générée avec succès !");
            } catch (e) { showToast("Erreur lors de la génération."); }
        }
        function handleDecrypt() {
            const inputData = document.getElementById('decrypt-input').value;
            const rawKey = document.getElementById('decrypt-sec-key-input').value;
            if (rawKey.length < 24) { showToast("Erreur: Clé < 24 caractères !"); validateDecryptKeyInput(); return; }
            if (!inputData.trim()) { showToast("Veuillez coller le texte à déchiffrer."); return; }
            try {
                let cipherToDecrypt = inputData.trim();
                const extractedFromZeroWidth = zeroWidthToText(inputData);

    <canvas id="steg-canvas" style="display:none;"></canvas>

    <script>
        let currentMode = 'encode';
        let loadedImage = null;
        let loadedFile = null;
        const DELIMITER = "||BSTEGANO_END||";

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileNameEl = document.getElementById('file-name');
        const secretMsgEl = document.getElementById('secret-message');

        const decodedOutput = document.getElementById('decoded-output');
